    <script>
      // Google Analytics - Replace GA_MEASUREMENT_ID with your actual ID
      (function() {
        const GA_ID = 'G-H8BLWQRJXV'; // Replace with your Google Analytics Measurement ID (G-XXXXXXXXXX)
        
        if (GA_ID && GA_ID !== 'GA_MEASUREMENT_ID') {
          // Load Google Analytics
          const script = document.createElement('script');
          script.async = true;
          script.src = `https://www.googletagmanager.com/gtag/js?id=${GA_ID}`;
          document.head.appendChild(script);
          
          // Initialize gtag
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', GA_ID);
          
          // Make gtag available globally
          window.gtag = gtag;
          
          console.log('Google Analytics initialized with ID:', GA_ID);
        } else {
          console.log('Google Analytics not configured - please set GA_MEASUREMENT_ID');
        }
      })();
    </script>

      /* Poppins font configuration */
      @font-face {

    <style>
      /* For custom scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f8fafc; /* slate-50 */
      }
      .dark ::-webkit-scrollbar-track {
        background: #0f172a; /* slate-900 */
      }
      .dark.midnight ::-webkit-scrollbar-track {
        background: #1e293b; /* slate-800 */
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; /* slate-300 */
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #475569; /* slate-600 */
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; /* slate-400 */
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #334155; /* slate-700 */
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slide-up {
        from { transform: translateY(20px) scale(0.98); opacity: 0; }
        to { transform: translateY(0) scale(1); opacity: 1; }
      }
      
      /* For mention input */
      .chat-input-container {
        position: relative;
        flex: 1;
        display: grid;
      }
      .chat-input-backdrop, .chat-input {
        grid-area: 1 / 1 / 2 / 2;
        padding: 0.75rem; /* p-3 */
        font-size: 1rem;
        line-height: 1.5;
        border-radius: 0.5rem; /* rounded-lg */
        border: 1px solid;
        min-height: 50px; /* match button height */
        max-height: 120px;
        white-space: pre-wrap;
        word-wrap: break-word;
        overflow-y: auto;
      }
      .chat-input {
        color: transparent;
        caret-color: #334155; /* slate-700 */
        background: transparent;
        z-index: 1;
        resize: none;
      }
      .dark .chat-input {
        caret-color: #e2e8f0; /* slate-200 */
      }
      .chat-input:focus {
        outline: none;
      }
      .chat-input-backdrop {
        pointer-events: none;
      }
      .mention-highlight {
        color: #4f46e5; /* indigo-600 */
        font-weight: 600;
        background-color: rgba(99, 102, 241, 0.1);
        border-radius: 4px;
        padding: 0 2px;
      }
      .dark .mention-highlight {
        color: #818cf8; /* indigo-400 */
        background-color: rgba(129, 140, 248, 0.15);
      }
      
      /* Ensure code blocks use default monospace font instead of Poppins */
      pre, code, .prose pre, .prose code, .chatgpt-markdown pre, .chatgpt-markdown code {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Consolas, 'Liberation Mono', Menlo, Monaco, 'Cascadia Code', 'Roboto Mono', 'Oxygen Mono', 'Ubuntu Monospace', 'Source Code Pro', 'Fira Mono', 'Droid Sans Mono', 'Courier New', monospace !important;
      }
    </style>
