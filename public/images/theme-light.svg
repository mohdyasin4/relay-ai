<svg width="80" height="60" viewBox="0 0 80 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" width="78" height="58" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <g filter="url(#shadow)">
    <rect x="42" y="34" width="28" height="18" rx="6" fill="#F3F4F6" stroke="#D1D5DB"/>
  </g>
  <text x="56" y="47" text-anchor="middle" alignment-baseline="middle" font-size="10" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" fill="#6B7280">Aa</text>
  <defs>
    <filter id="shadow" x="42" y="34" width="28" height="18" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feOffset dy="0.5"/>
