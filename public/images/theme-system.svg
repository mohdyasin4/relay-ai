      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="78" height="58" rx="10" fill="url(#split)" stroke="#1F2937"/>
  <g filter="url(#shadow)">
    <rect x="42" y="34" width="28" height="18" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
  </g>
  <rect x="42" y="34" width="14" height="18" rx="6" fill="#0F172A"/>
  <text x="56" y="47" text-anchor="middle" alignment-baseline="middle" font-size="10" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" fill="#111827">Aa</text>
  <defs>
    <filter id="shadow" x="42" y="34" width="28" height="18" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
